[tools]
bun = "1.3.14"
go = "1.26.0"
"go:github.com/tc-hib/go-winres" = "0.3.3"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.build]
description = "Generate remote-windows.json and apply it to the Karabiner profile"
run = "bun scripts/build_karabiner.ts"

[tasks.reload]
description = "Restart Karabiner console user server"
run = "launchctl kickstart -k gui/$(id -u)/org.pqrs.service.agent.Karabiner-Console-User-Server"

[tasks.check]
description = "Type-check the generator"
run = "bunx tsc"

[tasks."build:eisu-kana"]
description = "Build windows/eisu-kana as dist/eisu-kana.exe (Windows x64, with icon and version info)"
dir = "windows/eisu-kana"
env = { GOOS = "windows", GOARCH = "amd64", CGO_ENABLED = "0" }
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "go vet ./...",
  "go-winres make --arch amd64",
  # Symbols are kept on purpose: stripped Go binaries are more likely to be flagged by antivirus.
  "go build -trimpath -ldflags '-H windowsgui' -o ../../dist/eisu-kana.exe .",
]

[tasks."icons:eisu-kana"]
description = "Render windows/eisu-kana/winres/*.svg to PNG (needs rsvg-convert)"
dir = "windows/eisu-kana/winres"
run = [
  "rsvg-convert -w 256 -h 256 icon.svg -o icon.png",
  "rsvg-convert -w 48 -h 48 icon.svg -o icon48.png",
  "rsvg-convert -w 32 -h 32 icon.svg -o icon32.png",
  "rsvg-convert -w 16 -h 16 icon16.svg -o icon16.png",
]

[tasks."release:eisu-kana"]
description = "Build eisu-kana.exe and publish it as GitHub release eisu-kana-v<version>"
depends = ["build:eisu-kana"]
run = '''
set -eu
version=$(bun -e '
const v = require("./windows/eisu-kana/winres/winres.json").RT_VERSION["#1"]["0000"]
const all = [v.info["0409"].FileVersion, v.info["0409"].ProductVersion,
  v.fixed.file_version.replace(/\.0$/, ""), v.fixed.product_version.replace(/\.0$/, "")]
if (new Set(all).size !== 1) { console.error("version mismatch in winres.json:", all); process.exit(1) }
console.log(all[0])')
test -z "$(git status --porcelain)" || { echo "working tree is not clean" >&2; exit 1; }
git fetch -q origin main
git merge-base --is-ancestor HEAD origin/main || { echo "HEAD is not pushed to origin/main" >&2; exit 1; }
gh release create "eisu-kana-v$version" dist/eisu-kana.exe \
  --target "$(git rev-parse HEAD)" \
  --title "Eisu Kana $version" \
  --notes "Place eisu-kana.exe in %LOCALAPPDATA%\\Programs\\EisuKana and start it. See README for details.

SHA-256: $(shasum -a 256 dist/eisu-kana.exe | cut -d' ' -f1)"
'''
