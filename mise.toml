[tools]
bun = "1.3.14"
go = "1.26.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.build]
description = "Generate remote-windows.json and apply it to the Karabiner profile"
run = "bun scripts/build_karabiner.ts"

[tasks.reload]
description = "Restart Karabiner console user server"
run = "launchctl kickstart -k gui/$(id -u)/org.pqrs.service.agent.Karabiner-Console-User-Server"

[tasks.check]
description = "Type-check the generator"
run = "bunx tsc"

[tasks."build:ime-toggle"]
description = "Build windows/ime-toggle as dist/ime-toggle.exe (Windows x64)"
dir = "windows/ime-toggle"
env = { GOOS = "windows", GOARCH = "amd64", CGO_ENABLED = "0" }
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "go vet ./...",
  "go build -trimpath -ldflags '-s -w -H windowsgui' -o ../../dist/ime-toggle.exe .",
]
